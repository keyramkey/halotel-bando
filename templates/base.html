<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PWA Manifest Links -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#f56b00">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
    <title>
        {% block title %}MR. SULE DIGITAL SERVICES BUSINESS{% endblock %}
    </title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            color: #161616;
        }
        a {
            color: inherit;
            text-decoration: none;
        }
        button, input, textarea, select { font: inherit; }
        .app {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;
            margin: auto;
            background: #f4f5f7;
            padding-bottom: 92px;
        }
        .topbar {
            background: #fff;
            padding: 17px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
        }
        .brand {
            font-size: 21px;
            font-weight: 900;
        }
        .brand span { color: #f56b00; }
        .icon-btn {
            border: 0;
            background: #f1f1f1;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: grid;
            place-items: center;
        }
        .page { padding: 16px; }
        .card {
            background: #fff;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 14px;
        }
        .title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 5px;
        }
        .muted {
            color: #777;
            font-size: 13px;
        }
        .input {
            width: 100%;
            height: 50px;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 0 14px;
            outline: none;
            background: #fff;
            margin-top: 7px;
        }
        .input:focus { border-color: #f56b00; }
        textarea.input {
            height: 100px;
            padding-top: 14px;
            resize: vertical;
        }
        .btn {
            width: 100%;
            border: 0;
            border-radius: 13px;
            min-height: 50px;
            background: #151515;
            color: white;
            font-weight: 800;
            cursor: pointer;
            padding: 10px 15px;
        }
        .btn.orange { background: #f56b00; }
        .btn.green { background: #159447; }
        .btn.danger { background: #d92d20; }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: min(520px, 100%);
            height: 70px;
            background: linear-gradient(135deg, #ff8a00 0%, #f56b00 50%, #ed4d00 100%);
            border-top: none;
            box-shadow: 0 -4px 18px rgba(245, 107, 0, 0.35);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }
        .nav-item {
            text-align: center;
            color: rgba(255,255,255,0.75);
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            min-width: 52px;
            padding: 4px 2px;
        }
        .nav-item small {
            display: block;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }
        .nav-item svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.85;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .nav-item.active {
            color: #fff;
        }
        .nav-item.active svg {
            stroke: #fff;
        }
        .network-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .network-card {
            background: #fff;
            border-radius: 18px;
            padding: 17px;
            border: 1px solid #eee;
        }
        .network-icon {
            width: 48px;
            height: 48px;
            border-radius: 15px;
            background: #fff2e8;
            display: grid;
            place-items: center;
            font-size: 24px;
            margin-bottom: 12px;
        }
        .network-card h3 {
            font-size: 16px;
            margin-bottom: 5px;
        }
        .network-card p {
            font-size: 11px;
            color: #777;
        }
        .agency-hero {
            margin: 14px;
            padding: 23px;
            border-radius: 22px;
            color: white;
            background: linear-gradient(135deg, #111, #2d2d2d);
        }
        .agency-hero-icon { font-size: 43px; }
        .agency-hero h1 {
            font-size: 27px;
            margin: 8px 0;
        }
        .agency-hero p {
            font-size: 13px;
            color: #ccc;
            line-height: 1.5;
        }
        .service-grid {
            display: grid;
            gap: 11px;
            padding: 0 14px;
        }
        .service-card {
            background: white;
            border-radius: 17px;
            padding: 16px;
            display: flex;
            gap: 13px;
            align-items: center;
            border: 1px solid #eee;
        }
        .service-icon {
            width: 47px;
            height: 47px;
            border-radius: 14px;
            background: #fff1e7;
            display: grid;
            place-items: center;
            font-size: 22px;
            flex-shrink: 0;
        }
        .service-info { flex: 1; }
        .service-info h3 {
            font-size: 15px;
            margin-bottom: 4px;
        }
        .service-info p {
            font-size: 11px;
            color: #777;
            line-height: 1.4;
        }
        .arrow {
            font-size: 20px;
            color: #f56b00;
        }
        .form-label {
            display: block;
            margin-top: 14px;
            font-size: 12px;
            font-weight: bold;
        }
        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: bold;
        }
        .status.pending { background: #fff4d6; color: #996b00; }
        .status.processing { background: #e7f0ff; color: #2761ad; }
        .status.completed { background: #e4f8eb; color: #168044; }
        .status.rejected { background: #ffe7e7; color: #b42318; }
        .application-card {
            background: #fff;
            border-radius: 18px;
            padding: 17px;
            margin-bottom: 12px;
            border: 1px solid #eee;
        }
        .application-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .application-code {
            font-size: 13px;
            font-weight: 900;
        }
        .application-network {
            margin-top: 7px;
            font-size: 12px;
            color: #777;
        }
        .chat-box {
            background: #eee;
            border-radius: 18px;
            padding: 12px;
            min-height: 350px;
            max-height: 520px;
            overflow-y: auto;
            margin-bottom: 12px;
        }
        .chat-message {
            max-width: 82%;
            padding: 10px 12px;
            border-radius: 15px;
            margin-bottom: 9px;
            font-size: 13px;
            line-height: 1.4;
        }
        .chat-message.customer {
            margin-left: auto;
            background: #f56b00;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .chat-message.admin {
            margin-right: auto;
            background: white;
            border-bottom-left-radius: 4px;
        }
        .chat-message.system {
            margin: 10px auto;
            background: #ddd;
            color: #555;
            text-align: center;
            font-size: 11px;
        }
        .chat-time {
            display: block;
            margin-top: 4px;
            opacity: .65;
            font-size: 9px;
        }
        .chat-form {
            display: flex;
            gap: 8px;
        }
        .chat-form input {
            flex: 1;
            height: 48px;
            border: 1px solid #ddd;
            border-radius: 13px;
            padding: 0 13px;
        }
        .chat-form button {
            width: 55px;
            border: 0;
            border-radius: 13px;
            background: #f56b00;
            color: white;
            font-size: 20px;
        }
        .info-box {
            background: #fff7ed;
            border: 1px solid #ffd8b5;
            color: #744210;
            padding: 13px;
            border-radius: 14px;
            font-size: 11px;
            line-height: 1.5;
            margin-bottom: 15px;
        }
        /* ===== APP TOAST / MODAL ===== */
        .app-toast-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 9999;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 16px;
            padding-bottom: 90px;
            opacity: 0;
            visibility: hidden;
            transition: 0.25s ease;
        }
        .app-toast-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .app-toast {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 20px;
            padding: 24px 20px 18px;
            box-shadow: 0 -8px 40px rgba(0,0,0,0.18);
            transform: translateY(40px);
            transition: 0.25s ease;
            text-align: center;
        }
        .app-toast-overlay.show .app-toast {
            transform: translateY(0);
        }
        .app-toast-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 12px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 26px;
        }
        .app-toast-icon.error { background: #fdecea; }
        .app-toast-icon.success { background: #e8f8ef; }
        .app-toast-title {
            font-size: 16px;
            font-weight: 800;
            color: #171717;
            margin-bottom: 6px;
        }
        .app-toast-msg {
            font-size: 13.5px;
            color: #555;
            line-height: 1.5;
            margin-bottom: 18px;
        }
        .app-toast-btn {
            width: 100%;
            min-height: 48px;
            border: 0;
            border-radius: 14px;
            background: linear-gradient(135deg, #ff7800, #ed4d00);
            color: #fff;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
        }
        .app-toast-btn:active {
            transform: scale(0.98);
        }
        /* ===== TOP PUSH NOTIFICATION BANNER ===== */
        #pushBannerStack {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: min(520px, 100%);
            z-index: 10050;
            pointer-events: none;
            padding: 10px 12px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .push-banner {
            pointer-events: auto;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a1a0a 50%, #1a1208 100%);
            color: #fff;
            border-radius: 16px;
            padding: 14px 14px 14px 16px;
            box-shadow:
                0 12px 40px rgba(0,0,0,0.35),
                0 0 0 1px rgba(245,107,0,0.35),
                inset 0 1px 0 rgba(255,255,255,0.08);
            transform: translateY(-120%);
            opacity: 0;
            transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            cursor: pointer;
            overflow: hidden;
            position: relative;
        }
        .push-banner::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, #ff8a00, #f56b00, #ed4d00);
        }
        .push-banner.show {
            transform: translateY(0);
            opacity: 1;
        }
        .push-banner.hide {
            transform: translateY(-120%);
            opacity: 0;
        }
        .push-banner-icon {
            flex-shrink: 0;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff8a00, #f56b00);
            display: grid;
            place-items: center;
            font-size: 20px;
            box-shadow: 0 4px 14px rgba(245,107,0,0.45);
        }
        .push-banner-body {
            flex: 1;
            min-width: 0;
            padding-top: 1px;
        }
        .push-banner-title {
            font-size: 13.5px;
            font-weight: 800;
            letter-spacing: 0.2px;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .push-banner-msg {
            font-size: 12.5px;
            color: rgba(255,255,255,0.82);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .push-banner-close {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            border: 0;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.75);
            font-size: 16px;
            cursor: pointer;
            display: grid;
            place-items: center;
            margin-top: 2px;
        }
        .push-banner-close:active {
            background: rgba(255,255,255,0.2);
        }
        .push-banner-progress {
            position: absolute;
            left: 0;
            bottom: 0;
            height: 3px;
            background: linear-gradient(90deg, #ff8a00, #f56b00);
            width: 100%;
            transform-origin: left;
            animation: pushProgress 5s linear forwards;
        }
        @keyframes pushProgress {
            from { transform: scaleX(1); }
            to { transform: scaleX(0); }
        }
        /* Enable notifications prompt */
        #enablePushBar {
            display: none;
            position: fixed;
            bottom: 78px;
            left: 50%;
            transform: translateX(-50%);
            width: min(492px, calc(100% - 24px));
            z-index: 200;
            background: #fff;
            border-radius: 16px;
            padding: 12px 14px;
            box-shadow: 0 8px 28px rgba(0,0,0,0.15);
            border: 1px solid #eee;
            align-items: center;
            gap: 10px;
        }
        #enablePushBar.show { display: flex; }
        #enablePushBar p {
            flex: 1;
            font-size: 12px;
            color: #333;
            line-height: 1.35;
        }
        #enablePushBar button {
            border: 0;
            border-radius: 10px;
            background: #f56b00;
            color: #fff;
            font-weight: 800;
            font-size: 12px;
            padding: 10px 12px;
            white-space: nowrap;
            cursor: pointer;
        }
        #enablePushBar .dismiss-push {
            background: #eee;
            color: #555;
        }
    </style>
</head>
<body>
<div class="app">
    {% block content %}
    {% endblock %}

    <nav class="bottom-nav">
        <a href="{{ url_for('home') }}" class="nav-item">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"/></svg>
            <small>Home</small>
        </a>
        <a href="{{ url_for('order') }}" class="nav-item">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/></svg>
            <small>Bando</small>
        </a>
        <a href="{{ url_for('agency') }}" class="nav-item">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18"/><path d="M5 21V8l7-4 7 4v13"/><path d="M9 21v-6h6v6"/><path d="M10 11h4"/></svg>
            <small>Uwakala</small>
        </a>
        {% if current_user %}
            <a href="{{ url_for('nakala') }}" class="nav-item">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h6"/></svg>
                <small>Nakala</small>
            </a>
            <a href="{{ url_for('profile') }}" class="nav-item">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <small>Profile</small>
            </a>
        {% else %}
            <a href="{{ url_for('login') }}" class="nav-item">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
                <small>Login</small>
            </a>
        {% endif %}
    </nav>
</div>

<!-- TOP PUSH BANNERS -->
<div id="pushBannerStack" aria-live="polite"></div>

<!-- Enable notifications bar -->
<div id="enablePushBar">
    <p>Washa arifa ili upate taarifa za bando, chat na maombi haraka.</p>
    <button type="button" id="enablePushBtn">Washa</button>
    <button type="button" class="dismiss-push" id="dismissPushBtn">Baadaye</button>
</div>

<!-- APP TOAST MODAL -->
<div class="app-toast-overlay" id="appToast">
    <div class="app-toast">
        <div class="app-toast-icon" id="toastIcon">!</div>
        <div class="app-toast-title" id="toastTitle">Taarifa</div>
        <div class="app-toast-msg" id="toastMsg"></div>
        <button type="button" class="app-toast-btn" id="toastClose">Sawa</button>
    </div>
</div>

<script>
(function() {
    var overlay = document.getElementById('appToast');
    var iconEl = document.getElementById('toastIcon');
    var titleEl = document.getElementById('toastTitle');
    var msgEl = document.getElementById('toastMsg');
    var closeBtn = document.getElementById('toastClose');

    function showToast(message, category) {
        if (!message) return;
        var isError = (category || '').indexOf('error') !== -1 || (category || '').indexOf('danger') !== -1;
        iconEl.textContent = isError ? '!' : '✓';
        iconEl.className = 'app-toast-icon ' + (isError ? 'error' : 'success');
        titleEl.textContent = isError ? 'Imeshindwa' : 'Imefanikiwa';
        msgEl.textContent = message;
        overlay.classList.add('show');
    }

    closeBtn.addEventListener('click', function() {
        overlay.classList.remove('show');
    });
    overlay.addEventListener('click', function(e) {
        if (e.target === overlay) overlay.classList.remove('show');
    });

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                showToast({{ message|tojson }}, {{ category|tojson }});
            {% endfor %}
        {% endif %}
    {% endwith %}

    var stack = document.getElementById('pushBannerStack');
    function showPushBanner(title, body, url) {
        var el = document.createElement('div');
        el.className = 'push-banner';
        el.innerHTML =
            '<div class="push-banner-icon">•</div>' +
            '<div class="push-banner-body">' +
                '<div class="push-banner-title"></div>' +
                '<div class="push-banner-msg"></div>' +
            '</div>' +
            '<button type="button" class="push-banner-close" aria-label="Funga">×</button>' +
            '<div class="push-banner-progress"></div>';
        el.querySelector('.push-banner-title').textContent = title || 'MR. SULE';
        el.querySelector('.push-banner-msg').textContent = body || '';
        stack.appendChild(el);
        requestAnimationFrame(function() { el.classList.add('show'); });
        function dismiss() {
            el.classList.remove('show');
            el.classList.add('hide');
            setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
        }
        el.querySelector('.push-banner-close').addEventListener('click', function(e) {
            e.stopPropagation();
            dismiss();
        });
        el.addEventListener('click', function() {
            dismiss();
            if (url) window.location.href = url;
        });
        setTimeout(dismiss, 5000);
    }

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('message', function(event) {
            var d = event.data || {};
            if (d.type === 'PUSH_NOTIFICATION') {
                showPushBanner(d.title, d.body, d.url);
            } else if (d.type === 'NOTIFICATION_CLICK' && d.url) {
                if (window.location.pathname !== d.url) window.location.href = d.url;
            }
        });
    }

    var isLoggedIn = {{ 'true' if current_user else 'false' }};
    var enableBar = document.getElementById('enablePushBar');
    var enableBtn = document.getElementById('enablePushBtn');
    var dismissBtn = document.getElementById('dismissPushBtn');

    function urlBase64ToUint8Array(base64String) {
        var padding = '='.repeat((4 - base64String.length % 4) % 4);
        var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        var rawData = window.atob(base64);
        var outputArray = new Uint8Array(rawData.length);
        for (var i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
        return outputArray;
    }

    async function subscribePush() {
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) return false;
        try {
            var reg = await navigator.serviceWorker.ready;
            var keyRes = await fetch('/api/push/vapid-public-key');
            if (!keyRes.ok) return false;
            var keyData = await keyRes.json();
            if (!keyData.publicKey) return false;
            var sub = await reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(keyData.publicKey)
            });
            var res = await fetch('/api/push/subscribe', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(sub.toJSON())
            });
            return res.ok;
        } catch (err) {
            console.warn('Push subscribe failed', err);
            return false;
        }
    }

    async function ensurePush() {
        if (!isLoggedIn) return;
        if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) return;
        if (Notification.permission === 'granted') { await subscribePush(); return; }
        if (Notification.permission === 'denied') return;
        try { if (localStorage.getItem('push_dismissed') === '1') return; } catch (_) {}
        enableBar.classList.add('show');
    }

    if (enableBtn) {
        enableBtn.addEventListener('click', async function() {
            enableBar.classList.remove('show');
            var perm = await Notification.requestPermission();
            if (perm === 'granted') {
                var ok = await subscribePush();
                if (ok) showPushBanner('Arifa zimewashwa', 'Utapata taarifa za bando, chat na maombi papo hapo.', '/');
            }
        });
    }
    if (dismissBtn) {
        dismissBtn.addEventListener('click', function() {
            enableBar.classList.remove('show');
            try { localStorage.setItem('push_dismissed', '1'); } catch (_) {}
        });
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').then(function() {
                setTimeout(ensurePush, 1200);
            }).catch(function() {});
        });
    }
})();
</script>
</body>
</html>

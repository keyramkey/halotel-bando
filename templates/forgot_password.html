{% extends "base.html" %}
{% block title %}Umesahau Password{% endblock %}
{% block content %}
<style>
    .auth {
        min-height: calc(100vh - 70px);
        padding: 30px 18px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .auth-card {
        width: 100%;
        background: white;
        border-radius: 20px;
        padding: 24px 22px;
        border: 1px solid #eee;
    }
    .auth-card h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .auth-card .muted { font-size: 13px; margin-bottom: 8px; line-height: 1.5; }
    .field { margin-top: 16px; }
    .field label {
        display: block; font-size: 13px; font-weight: 700;
        margin-bottom: 7px; color: #333;
    }
    .auth-link { text-align: center; margin-top: 18px; color: #777; font-size: 13px; }
    .auth-link a { color: #f56b00; font-weight: 700; }
</style>
<div class="auth">
    <div class="auth-card">
        <h1>Umesahau Password?</h1>
        <p class="muted">Weka namba ya simu au username. Tutakutumia OTP kwa SMS.</p>
        <form method="POST">
            <div class="field">
                <label>Username / Namba ya simu</label>
                <input
                    class="input"
                    name="identity"
                    required
                    placeholder="Mfano: 07XXXXXXXX"
                    autocomplete="username"
                >
            </div>
            <div style="margin-top:22px;">
                <button class="btn orange" type="submit">Tuma OTP kwa SMS</button>
            </div>
        </form>
        <div class="auth-link">
            <a href="{{ url_for('login') }}">← Rudi Login</a>
        </div>
    </div>
</div>
{% endblock %}

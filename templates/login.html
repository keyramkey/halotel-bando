{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<style>
    .auth {
        min-height: calc(100vh - 70px);
        padding: 30px 18px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .auth-card {
        width: 100%;
        background: white;
        border-radius: 20px;
        padding: 24px 22px;
        border: 1px solid #eee;
    }
    .auth-card h1 {
        font-size: 24px;
        font-weight: 800;
        margin-bottom: 6px;
    }
    .auth-card .muted {
        font-size: 13px;
        margin-bottom: 8px;
    }
    .field {
        margin-top: 16px;
    }
    .field label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 7px;
        color: #333;
    }
    .password-wrapper {
        position: relative;
    }
    .password-wrapper .input {
        padding-right: 48px; /* nafasi ya kajicho */
    }
    .toggle-password {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #888;
        transition: color 0.2s;
    }
    .toggle-password:hover {
        color: #f56b00;
    }
    .toggle-password svg {
        width: 22px;
        height: 22px;
    }
    .auth-link {
        text-align: center;
        margin-top: 18px;
        color: #777;
        font-size: 13px;
    }
    .auth-link a {
        color: #f56b00;
        font-weight: 700;
    }
    .forgot-link {
        display: block;
        text-align: right;
        margin-top: 10px;
        font-size: 13px;
    }
    .forgot-link a {
        color: #f56b00;
        font-weight: 600;
        text-decoration: none;
    }
</style>

<div class="auth">
    <div class="auth-card">
        <h1>Karibu tena</h1>
        <p class="muted">Ingia kwenye akaunti yako</p>
        <form method="POST">
            <div class="field">
                <label>Username / Namba / Email</label>
                <input
                    class="input"
                    name="identity"
                    required
                    placeholder="Weka taarifa yako"
                    autocomplete="username"
                >
            </div>
            <div class="field">
                <label>Password</label>
                <div class="password-wrapper">
                    <input
                        class="input"
                        type="password"
                        name="password"
                        id="password"
                        required
                        placeholder="Password"
                        autocomplete="current-password"
                    >
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Onyesha au ficha password">
                        <!-- Eye icon (closed) -->
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <!-- Eye-slash icon (hidden by default) -->
                        <svg id="eyeSlashIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display: none;">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                        </svg>
                    </button>
                </div>
                <div class="forgot-link">
                    <a href="{{ url_for('forgot_password') }}">Umesahau password?</a>
                </div>
            </div>
            <div style="margin-top:22px;">
                <button class="btn orange" type="submit">
                    Ingia
                </button>
            </div>
        </form>
        <div class="auth-link">
            Huna akaunti?
            <a href="{{ url_for('register') }}">Jisajili</a>
        </div>
    </div>
</div>

<script>
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const eyeSlashIcon = document.getElementById('eyeSlashIcon');

    toggleBtn.addEventListener('click', function () {
        const isPassword = passwordInput.type === 'password';
        
        passwordInput.type = isPassword ? 'text' : 'password';
        
        // Toggle icons
        eyeIcon.style.display = isPassword ? 'none' : 'block';
        eyeSlashIcon.style.display = isPassword ? 'block' : 'none';
    });
</script>
{% endblock %}

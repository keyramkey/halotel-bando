{% extends "base.html" %}
{% block title %}Leseni ya Biashara{% endblock %}
{% block content %}
<style>
    .form-section { margin-bottom: 18px; }
    .form-section h3 { font-size: 14px; margin-bottom: 10px; color: #333; }
    .req { color: #e74c3c; }
    .radio-group { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .radio-group label { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 10px; background: #f9f9f9; border-radius: 10px; }
</style>

<header class="topbar">
    <div>
        <div class="brand">Leseni ya Biashara</div>
        <div class="muted">Jaza taarifa kwa usahihi</div>
    </div>
    <a href="{{ url_for('nakala') }}" class="icon-btn">←</a>
</header>

<div class="page">
    <div class="info-box">
        <strong>Bei:</strong> TSh 10,000. Jaza taarifa zako kwa usahihi kabisa kama zilivyo kwenye NIDA.
    </div>

    <form method="POST" action="{{ url_for('nakala_license') }}">
        <div class="card">
            <div class="form-section">
                <label class="form-label">Aina ya Leseni <span class="req">*</span></label>
                <div class="radio-group">
                    <label><input type="radio" name="license_type" value="uwakala" required> Leseni ya Uwakala</label>
                    <label><input type="radio" name="license_type" value="duka"> Leseni ya Duka</label>
                </div>
            </div>

            <div class="form-section">
                <label class="form-label">Jina Kamili (Kwanza + Kati + Mwisho) <span class="req">*</span></label>
                <input type="text" name="full_name" class="input" placeholder="Mfano: Juma Ally Hassan" required>
            </div>

            <div class="form-section">
                <label class="form-label">Jina Kamili la Mama <span class="req">*</span></label>
                <input type="text" name="mother_name" class="input" required>
            </div>

            <div class="form-section">
                <label class="form-label">Namba ya NIDA / NIN (namba 20 tu) <span class="req">*</span></label>
                <input type="text" name="nida_number" class="input" maxlength="20" pattern="[0-9]{1,20}"
                       placeholder="Namba za NIDA tu" required
                       oninput="this.value=this.value.replace(/[^0-9]/g,'')">
            </div>

            <div class="form-section">
                <label class="form-label">Namba ya Simu 1 <span class="req">*</span></label>
                <input type="tel" name="phone1" class="input" placeholder="07XXXXXXXX" required>
            </div>

            <div class="form-section">
                <label class="form-label">Namba ya Simu 2 (si lazima)</label>
                <input type="tel" name="phone2" class="input" placeholder="07XXXXXXXX">
            </div>

            <div class="form-section">
                <label class="form-label">Jina la Shule ya Msingi <span class="req">*</span></label>
                <input type="text" name="primary_school" class="input" required>
            </div>

            <div class="form-section">
                <label class="form-label">Mwaka wa Kuhitimu Darasa la Saba <span class="req">*</span></label>
                <input type="text" name="year_completed" class="input" placeholder="Mfano: 2010" required>
            </div>

            <div class="form-section">
                <label class="form-label">Wilaya uliyosomea Shule ya Msingi <span class="req">*</span></label>
                <input type="text" name="school_district" class="input" required>
            </div>

            <div class="form-section">
                <label class="form-label">Mkoa uliyosomea Shule ya Msingi <span class="req">*</span></label>
                <input type="text" name="school_region" class="input" required>
            </div>

            <div class="form-section">
                <label class="form-label">Wilaya uliyojiandikishia NIDA <span class="req">*</span></label>
                <input type="text" name="nida_reg_district" class="input" required>
            </div>

            <div class="form-section">
                <label class="form-label">Mkoa uliyojiandikishia NIDA <span class="req">*</span></label>
                <input type="text" name="nida_reg_region" class="input" required>
            </div>

            <div class="form-section">
                <label class="form-label">Mtaa / Kijiji ulipojiandikishia NIDA <span class="req">*</span></label>
                <input type="text" name="nida_reg_street" class="input" required>
            </div>

            <button type="submit" class="btn orange" style="margin-top:16px;">
                Endelea → Hakiki Taarifa
            </button>
        </div>
    </form>
</div>
{% endblock %}

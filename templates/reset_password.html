{% extends "base.html" %}
{% block title %}Weka Password Mpya{% endblock %}
{% block content %}
<style>
    .auth {
        min-height: calc(100vh - 70px);
        padding: 30px 18px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .auth-card {
        width: 100%;
        background: white;
        border-radius: 20px;
        padding: 24px 22px;
        border: 1px solid #eee;
    }
    .auth-card h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .auth-card .muted { font-size: 13px; margin-bottom: 8px; line-height: 1.5; }
    .field { margin-top: 16px; }
    .field label {
        display: block; font-size: 13px; font-weight: 700;
        margin-bottom: 7px; color: #333;
    }
    .auth-link { text-align: center; margin-top: 18px; color: #777; font-size: 13px; }
    .auth-link a { color: #f56b00; font-weight: 700; }
    .hint-box {
        background: #e8f5e9; border: 1px solid #c8e6c9; border-radius: 12px;
        padding: 12px 14px; font-size: 12px; color: #2e7d32; margin-bottom: 4px; line-height: 1.5;
    }
</style>
<div class="auth">
    <div class="auth-card">
        <h1>Ingiza OTP</h1>
        <p class="muted">Angalia SMS uliyopokea, kisha weka password mpya.</p>
        <div class="hint-box">
            OTP inaisha baada ya <strong>dakika 15</strong>.
        </div>
        <form method="POST">
            <div class="field">
                <label>OTP (tarakimu 6 kutoka SMS)</label>
                <input
                    class="input"
                    name="otp"
                    required
                    placeholder="Mfano: 482915"
                    inputmode="numeric"
                    maxlength="6"
                    autocomplete="one-time-code"
                >
            </div>
            <div class="field">
                <label>Password mpya</label>
                <input class="input" type="password" name="password" required placeholder="Password mpya" autocomplete="new-password">
            </div>
            <div class="field">
                <label>Thibitisha password</label>
                <input class="input" type="password" name="password2" required placeholder="Andika tena" autocomplete="new-password">
            </div>
            <div style="margin-top:22px;">
                <button class="btn orange" type="submit">Badilisha Password</button>
            </div>
        </form>
        <div class="auth-link">
            <a href="{{ url_for('forgot_password') }}">Tuma OTP upya</a>
            ·
            <a href="{{ url_for('login') }}">Login</a>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Settings{% endblock %}

{% block content %}

<style>
    .settings-head {
        background: #151515;
        color: white;
        padding: 24px 18px;
    }

    .settings-head h1 {
        font-size: 27px;
    }

    .settings-page {
        padding: 15px;
    }

    .field {
        margin-bottom: 15px;
    }

    .field label {
        display: block;
        font-size: 13px;
        font-weight: bold;
        margin-bottom: 7px;
    }
</style>


<div class="settings-head">

    <h1>Settings</h1>

</div>


<div class="settings-page">

    <form method="POST" class="card">

        <div class="field">

            <label>Username</label>

            <input
                class="input"
                name="username"
                value="{{ current_user.username }}"
                required
            >

        </div>


        <div class="field">

            <label>Namba ya simu</label>

            <input
                class="input"
                name="phone"
                value="{{ current_user.phone }}"
                required
            >

        </div>


        <div class="field">

            <label>Email</label>

            <input
                class="input"
                value="{{ current_user.email or '' }}"
                disabled
            >

        </div>


        <button class="btn orange">
            Hifadhi Mabadiliko
        </button>

    </form>


    <div class="card">

        <h3 style="margin-bottom:8px;">
            Kuhusu
        </h3>

        <p class="muted">
            MR. SULE DIGITAL SERVICES BUSINESS — bando, usajili & uwakala.
        </p>
        <p class="muted" style="margin-top:10px;">
            <strong>Malipo:</strong> Vodacom {{ PAYMENT_NUMBER }} ({{ PAYMENT_NAME }})
        </p>

    </div>

</div>

{% endblock %}
